<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Box Game</title>
<style>
html,body{margin:0;height:100%;background:#0d1030;overflow:hidden;font-family:"Trebuchet MS","Arial Rounded MT Bold",system-ui,sans-serif;-webkit-tap-highlight-color:transparent;user-select:none}
canvas{display:block}
.scr{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:flex-start;z-index:5;color:#fff;overflow-y:auto;padding:18px 0 24px;box-sizing:border-box;background:radial-gradient(circle at 50% 25%,#3b4bb8 0,#1a1f5c 45%,#0b0d2a 100%)}
.scr>*:first-child{margin-top:auto}.scr>*:last-child{margin-bottom:auto}
.logo{font-size:64px;font-weight:900;letter-spacing:2px;line-height:.9;text-align:center;color:#ffd166;text-shadow:0 4px 0 #e85d04,0 8px 0 #7a2600,0 12px 18px rgba(0,0,0,.6);transform:rotate(-4deg);animation:wob 2.4s ease-in-out infinite}
.logo span{display:block;color:#fff;font-size:44px;text-shadow:0 4px 0 #4361ee,0 8px 0 #1b2a80,0 12px 18px rgba(0,0,0,.6)}
@keyframes wob{50%{transform:rotate(3deg) scale(1.04)}}
.tag{margin:16px 0 14px;color:#cdd6ff;font-size:15px;letter-spacing:1px}
.big{font-weight:900;font-size:24px;font-family:inherit;letter-spacing:1px;padding:14px 48px;border-radius:18px;border:0;color:#3a1c00;cursor:pointer;background:linear-gradient(#ffe066,#f7b801);box-shadow:0 6px 0 #b86e00,0 10px 20px rgba(0,0,0,.4);margin:6px}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 #b86e00}
.big.alt{background:linear-gradient(#9ad0ff,#4895ef);color:#062a55;box-shadow:0 6px 0 #1d5fa8,0 10px 20px rgba(0,0,0,.4)}
.sub{margin:18px 0 8px;font-weight:900;letter-spacing:3px;color:#9fb0ff;font-size:13px}
#roster{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:min(94vw,470px)}
.card{position:relative;background:linear-gradient(#41488f,#262a5c);border-radius:16px;border:3px solid #545cb0;box-shadow:0 5px 0 #14163a;padding:6px 4px 8px;text-align:center;cursor:pointer;transition:transform .15s,border-color .15s}
.card canvas{display:block;margin:0 auto;width:100%;max-width:120px;height:auto}
.card b{display:block;font-size:15px;color:#ffd166;margin-top:2px;text-shadow:0 2px 0 #000}
.card small{display:block;font-size:11.5px;color:#d6dcff;line-height:1.3;margin:4px 4px 0}
.card.sel{border-color:#ffd166;transform:translateY(-5px) scale(1.03);box-shadow:0 0 0 3px rgba(255,209,102,.35),0 8px 0 #14163a}
.card.locked{background:linear-gradient(#2a2d4f,#191b36);border-color:#33375f}
.card.locked canvas{filter:brightness(0) opacity(.75)}.card.locked b{color:#8088b8}
.lock{position:absolute;top:30%;left:50%;transform:translate(-50%,-50%);font-size:28px;filter:drop-shadow(0 2px 2px #000)}
.card.opp{background:linear-gradient(#8f414a,#5c2630);border-color:#b0545e;cursor:default}
.card.chosen{border-color:#ff6b6b;transform:scale(1.06);box-shadow:0 0 0 4px rgba(255,107,107,.5),0 8px 0 #3a1418}
.card.dim{opacity:.35;transform:scale(.94)}
#info{min-height:46px;width:min(92vw,460px);margin-top:12px;font-size:14px;text-align:center;color:#e6e9ff;background:rgba(0,0,0,.25);border-radius:12px;padding:8px 10px;box-sizing:border-box}
#info b{color:#ffd166}
.ptitle{font-weight:900;font-size:24px;color:#ffd166;text-shadow:0 3px 0 #7a2600;margin-bottom:6px}
.side{font-weight:900;letter-spacing:3px;font-size:13px;color:#9fd8ff;margin:8px 0 6px}.side.opp{color:#ffadad}
.row{display:flex;gap:12px;justify-content:center;width:min(94vw,440px)}.row .card{flex:1 1 0;max-width:210px}
.vsd{font-weight:900;font-size:34px;color:#fff;text-shadow:0 3px 0 #e63946,0 0 18px #e63946;margin:8px 0 0}
#phint{margin-top:12px;color:#cdd6ff;font-size:14px;min-height:20px}
#vs{flex-direction:row;justify-content:center;gap:4vw;background:linear-gradient(110deg,#4361ee 0 49.6%,#fff 49.6% 50.4%,#e63946 50.4%)}
#vs>*{margin:0!important}
#vs .fx{text-align:center;font-weight:900;font-size:22px;text-shadow:0 3px 0 #000}#vs canvas{width:min(36vw,220px);height:auto}
#vsl{animation:inl .5s ease-out}#vsr{animation:inr .5s ease-out}
.vsx{font-size:72px;font-weight:900;color:#ffd166;text-shadow:0 5px 0 #7a2600,0 0 30px #fff;animation:pop .6s cubic-bezier(.2,2,.4,1)}
@keyframes inl{from{transform:translateX(-60vw)}}@keyframes inr{from{transform:translateX(60vw)}}@keyframes pop{from{transform:scale(0) rotate(-30deg)}}
#win{background:radial-gradient(circle at 50% 40%,rgba(40,50,140,.88),rgba(8,10,30,.94))}.scr{overflow-x:hidden}
#win h2{font-size:42px;margin:0;color:#ffd166;text-shadow:0 4px 0 #7a2600,0 0 20px rgba(255,209,102,.6);animation:pop .6s cubic-bezier(.2,2,.4,1);text-align:center}
#wsub{font-size:18px;margin:6px 0 10px;color:#fff;font-weight:900;letter-spacing:2px}
#unl{display:none;text-align:center;margin:6px 0 14px;animation:pop .7s cubic-bezier(.2,2,.4,1)}#unl .t{font-size:22px;font-weight:900;color:#7CFC00;text-shadow:0 3px 0 #145214,0 0 16px #7CFC00}
#unl canvas{width:130px;height:auto;display:block;margin:6px auto 0;filter:drop-shadow(0 0 12px #ffd166)}
.btns{display:flex;flex-wrap:wrap;justify-content:center}
#mute{position:fixed;top:10px;right:10px;z-index:9;width:44px;height:44px;border-radius:50%;border:0;font-size:20px;background:rgba(0,0,0,.45);color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.4);cursor:pointer}
.modes{display:flex;gap:8px;margin:0 0 10px;background:rgba(0,0,0,.3);padding:5px;border-radius:16px}
.mode{font-weight:900;font-size:17px;font-family:inherit;color:#cdd6ff;background:transparent;border:0;padding:8px 18px;border-radius:12px;cursor:pointer}.mode.on{background:linear-gradient(#4cc9f0,#4361ee);color:#fff;box-shadow:0 3px 0 #1b2a80}
#stats{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 12px;margin:10px 0 0;font-size:13px;color:#cdd6ff}#stats b{color:#ffd166}
#roster{grid-template-columns:repeat(4,1fr);gap:8px;width:min(96vw,520px)}#roster .card{padding:4px 2px 6px;border-radius:13px}#roster .card b{font-size:12.5px}#roster .lock{font-size:22px}
.badge{position:absolute;top:4px;right:4px;font-size:10.5px;background:rgba(0,0,0,.55);border-radius:8px;padding:1px 4px;color:#ffd166}
.saverow{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:12px}.saverow button{font-weight:700;font-size:13px;font-family:inherit;color:#fff;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:10px;padding:7px 10px;cursor:pointer}#breset{color:#ffadad}
#codebox{display:block;width:100%;box-sizing:border-box;margin-top:6px;font:12px monospace;padding:6px;border-radius:8px;border:0;user-select:all;-webkit-user-select:all}
.row.four{gap:6px;width:min(96vw,520px)}.row.four .card{padding:4px 2px 6px}.row.four .card b{font-size:12.5px}
.vsteam{display:flex;flex-direction:column;align-items:center}
@media(max-width:420px){#roster .card b{font-size:11px}.logo{font-size:54px}.logo span{font-size:38px}.card small{font-size:11px}}
</style></head><body>
<div id="home" class="scr"><div class="logo">BOX<span>GAME</span></div><div class="tag">Bounce. Bonk. Win the box!</div><div class="modes"><button class="mode on" data-m="1">1 v 1</button><button class="mode" data-m="2">2 v 2</button></div><button id="hplay" class="big">PLAY</button><div id="stats"></div><div class="sub">ROSTER</div><div id="roster"></div><div id="info">Tap a fighter to see their ability. Win fights to unlock more!</div><div class="saverow"><button id="bexp">💾 Export save</button><button id="bimp">📥 Import save</button><button id="breset">🗑 Reset</button></div></div>
<div id="pick" class="scr"><div class="ptitle" id="ptitle">CHOOSE YOUR FIGHTER</div><div class="side">YOUR PICKS</div><div id="mine" class="row"></div><div class="vsd">VS</div><div class="side opp">OPPONENT'S PICKS</div><div id="theirs" class="row"></div><div id="phint">Tap one of your fighters</div></div>
<div id="vs" class="scr"><div id="vsl" class="fx"></div><div class="vsx">VS</div><div id="vsr" class="fx"></div></div>
<div id="win" class="scr"><h2 id="wt"></h2><div id="wsub"></div><div id="unl"></div><div class="btns"><button id="again" class="big">Play again</button><button id="homeb" class="big alt">Home</button></div></div>
<button id="mute" title="Music on/off">🔊</button>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');let W,H,M,box;
const skins=['#f1c27d','#e0ac69','#c68642','#8d5524','#ffdbac'],shirts=['#e63946','#457b9d','#2a9d8f','#f4a261','#9b5de5','#06d6a0','#ffd166'];
let seats=[],trees=[],people=[],bounces=0,cheer=0,ac=null,t=0;
const chars=[
{n:'Mom',d:'Charges her slipper for a WHACK (4-16). Mom Glare: her whack freezes the enemy for 0.75s.',skin:'#f1c27d',hair:'#6b3a1e',shirt:'#e75480',bg:'#ffd6e7',k:'mom'},
{n:'Grandpa',d:'Brings 5 friends (3 in 2v2) with tricks! Cane bonk 5. Loses 1.5 HP/s (he needs a nap).',skin:'#e8b88a',hair:'#e6e6e6',shirt:'#6c584c',bg:'#e6dccb',k:'gpa'},
{n:'Teacher',d:'Ruler swat 9. Every 30s: HOMEWORK! Enemy sits at a desk for 7s, can\'t attack, and her swats do 18.',skin:'#ffdbac',hair:'#7a4a2a',shirt:'#8e7dbe',k:'teach'},
{n:'Chef',d:'Hot pan bonk 9 + sizzle burn: 1 dmg every 0.6s for 3s (5 more).',skin:'#e0ac69',hair:'#2b1b0e',shirt:'#f8f8f8',k:'chef'},
{n:'Mail Carrier',d:'Parcel toss 10. Every 3rd hit is a SPECIAL DELIVERY for 24!',skin:'#c68642',hair:'#1b1b1b',shirt:'#5b8bd9',cap:'#2b4c7e',k:'mail'},
{n:'Coach',d:'Every 10s: 3s whistle sprint, fast and INVULNERABLE. Hits for 9 (12 sprinting).',skin:'#8d5524',hair:'#1b1b1b',shirt:'#1d6fd8',bg:'#cfe3ff',k:'coach'},
{n:'Firefighter',d:'Hose blast 14: knocks the enemy away and soaks them (slowed 1.5s).',skin:'#f1c27d',hair:'#5a3825',shirt:'#c8a24a',k:'fire'},
{n:'Baby',d:'Tiny and FAST (1.45x speed). Rattle bonk 11. So cute enemies hit her 30% softer.',skin:'#ffdbac',hair:'#d4a35a',shirt:'#a8dadc',k:'baby'},
{n:'Grandma',d:'Rolling pin 8. Every 8s bakes a COOKIE that heals her weakest teammate (or herself) 5 HP.',skin:'#f3c9a5',hair:'#dcdcdc',shirt:'#b5838d',k:'gma',lady:1},
{n:'Plumber',d:'Plunger 10: the enemy gets stuck for 1s, then POPS off for 4 more.',skin:'#e0ac69',hair:'#3b2a20',shirt:'#d62828',cap:'#2d6a4f',k:'plumb'},
{n:'Rock Star',d:'Guitar 9. Every 6s a power-chord RIFF wave hits all enemies nearby for 6 and pushes them.',skin:'#c68642',hair:'#7b2cbf',shirt:'#222222',k:'rock'},
{n:'Lunch Lady',d:'Ladle 12. Every 3rd hit is MYSTERY MEAT: a 22 dmg splat, a 3s slow, or a +12 snack for her.',skin:'#8d5524',hair:'#2b1b0e',shirt:'#2a9d8f',k:'lunch'}];
let pick=0,started=false,over=false,fx=[];
function fighter(g,ch,X,Y,r,st){st=st||{};const k=r/24,K=ch.k,wk=st.walk||0,lg=Math.sin(wk)*3.5,bob=Math.abs(Math.cos(wk))*1.5;
g.save();g.translate(X,Y);g.scale(k,k);if(K=='baby'){g.translate(0,6);g.scale(.8,.8)}g.lineCap='round';g.lineJoin='round';
{const sh=g.createRadialGradient(0,27,1,0,27,15);sh.addColorStop(0,'rgba(0,0,0,.4)');sh.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=sh;g.beginPath();g.ellipse(0,27,15,4.5,0,0,7);g.fill()}
if(st.glow){const gr=g.createRadialGradient(0,0,4,0,0,30);gr.addColorStop(0,'rgba(255,90,170,'+(.45*st.glow)+')');gr.addColorStop(1,'rgba(255,90,170,0)');g.fillStyle=gr;g.beginPath();g.arc(0,0,30+Math.sin(t*.2)*3*st.glow,0,7);g.fill()}
if(st.shield){g.fillStyle='rgba(120,200,255,.18)';g.strokeStyle='rgba(150,220,255,'+(.6+.3*Math.sin(t*.4))+')';g.lineWidth=2.5;g.beginPath();g.arc(0,0,31,0,7);g.fill();g.stroke()}
if(st.stun){g.fillStyle='#ffd166';g.font='bold 10px sans-serif';g.textAlign='center';for(let i=0;i<3;i++){const a=t*.15+i*2.1;g.fillText('★',Math.cos(a)*11,-34+Math.sin(a)*3)}}
if(st.burst){g.strokeStyle='rgba(255,255,255,.75)';g.lineWidth=2;for(let i=0;i<3;i++){g.beginPath();g.moveTo(-16-i*2,-4+i*9);g.lineTo(-28-i*2,-4+i*9);g.stroke()}}
g.translate(0,-bob);{const sq=st.hurt?1+Math.sin(t*.9)*.05:1;g.rotate((st.swing||0)*.22-(st.hurt?.08:0));g.scale(2-sq,sq)}
const OL='#2a1810',pants=({mom:'#3a4f7a',gpa:'#5b5048',teach:'#4a4e69',chef:'#555',mail:'#2b4c7e',fire:'#b08d3c',baby:'#a8dadc',gma:'#6c5b7b',plumb:'#1d4e89',rock:'#2b2b2b',lunch:'#6c757d'})[K]||'#1f2a44';
// legs+shoes
for(const s of[-1,1]){const sw=s*lg;g.strokeStyle=OL;g.lineWidth=7.4;g.beginPath();g.moveTo(s*4,9);g.lineTo(s*4.5+sw,23);g.stroke();
g.strokeStyle=K=='coach'?'#e8e8e8':pants;if(K=='coach'){g.strokeStyle=pants;g.lineWidth=5;g.beginPath();g.moveTo(s*4,9);g.lineTo(s*4.3+sw*.5,15);g.stroke();g.strokeStyle=ch.skin}
g.lineWidth=5;g.beginPath();g.moveTo(s*4,K=='coach'?15:9);g.lineTo(s*4.5+sw,23);g.stroke();
g.fillStyle=({mom:'#ff69b4',gpa:'#3b2a20',fire:'#222',gma:'#7b4a1e',plumb:'#5a3825',rock:'#111'})[K]||'#fff';g.strokeStyle=OL;g.lineWidth=1;g.beginPath();g.ellipse(s*4.5+sw+s*1.5,24.5,4.8,2.7,0,0,7);g.fill();g.lineWidth=1.3;g.stroke();g.fillStyle='rgba(255,255,255,.4)';g.beginPath();g.ellipse(s*4.5+sw+s*1.5-1,23.6,2,.8,0,0,7);g.fill()}
// torso
const sg=g.createLinearGradient(-9,0,9,0);sg.addColorStop(0,shade(ch.shirt,25));sg.addColorStop(1,shade(ch.shirt,-40));g.fillStyle=sg;g.strokeStyle=OL;g.lineWidth=1.5;
g.beginPath();g.moveTo(-8,-4);g.quadraticCurveTo(0,-7,8,-4);g.lineTo(K=='mom'?10:8.5,K=='mom'?12:10);g.lineTo(K=='mom'?-10:-8.5,K=='mom'?12:10);g.closePath();g.fill();g.stroke();
if(K=='mom'){g.fillStyle='rgba(255,255,255,.65)';for(const[a,b]of[[-5,2],[3,0],[-1,7],[5,8],[-6,9]]){g.beginPath();g.arc(a,b,1.1,0,7);g.fill()}}
if(K=='coach'){g.fillStyle='#fff';g.fillRect(-8.3,2,16.6,2);g.strokeStyle='#f5c542';g.lineWidth=.8;g.beginPath();g.moveTo(-3,-5);g.lineTo(0,1);g.lineTo(3,-5);g.stroke();g.fillStyle='#ccc';g.beginPath();g.arc(0,1.5,1.4,0,7);g.fill()}
if(K=='chef'){g.fillStyle='#bbb';for(const yy of[-1,3,7])for(const xx of[-2.5,2.5]){g.beginPath();g.arc(xx,yy,.9,0,7);g.fill()}g.fillStyle='#e63946';g.beginPath();g.moveTo(-3,-5);g.lineTo(0,-2);g.lineTo(3,-5);g.fill()}
if(K=='mail'){g.strokeStyle='#6b3e1f';g.lineWidth=2;g.beginPath();g.moveTo(-7,-4);g.lineTo(7,8);g.stroke();g.fillStyle='#8a5a2b';g.beginPath();g.roundRect(3,5,8,6,1.5);g.fill();g.fillStyle='#fff';g.fillRect(-6,-1,4,3)}
if(K=='fire'){for(const yy of[2,7.5]){g.fillStyle='#f1f3f5';g.fillRect(-9,yy,18,2.4);g.fillStyle='#ffd60a';g.fillRect(-9,yy-.6,18,.6);g.fillRect(-9,yy+2.4,18,.6)}g.strokeStyle='#8a6d1f';g.lineWidth=.8;g.beginPath();g.moveTo(0,-6);g.lineTo(0,10);g.stroke()}
if(K=='baby'){g.fillStyle='#fff';g.strokeStyle=OL;g.lineWidth=.8;g.beginPath();g.ellipse(0,-1,5.5,4.5,0,0,7);g.fill();g.stroke();g.fillStyle='#ff6b9a';g.beginPath();g.arc(-1,-1.5,1.1,0,7);g.arc(1,-1.5,1.1,0,7);g.moveTo(-2.1,-1.1);g.lineTo(0,1.4);g.lineTo(2.1,-1.1);g.fill();g.fillStyle='#fff';for(const xx of[-3,0,3]){g.beginPath();g.arc(xx,8,.9,0,7);g.fill()}}
if(K=='gma'){g.fillStyle='#fff';for(let a=0;a<7;a++){g.beginPath();g.arc(-4.5+a*1.5,-4.6+Math.sin(a/6*Math.PI)*1.6,.8,0,7);g.fill()}g.fillStyle='#fde2e4';g.strokeStyle=OL;g.lineWidth=.8;g.beginPath();g.roundRect(-5.5,1,11,10,2);g.fill();g.stroke();g.fillStyle='#e5989b';g.beginPath();g.arc(0,6,1.5,0,7);g.fill()}
if(K=='plumb'){g.fillStyle='#1d4e89';g.strokeStyle=OL;g.lineWidth=.8;g.beginPath();g.rect(-5.5,0,11,11);g.fill();g.stroke();g.strokeStyle='#1d4e89';g.lineWidth=2;g.beginPath();g.moveTo(-4.5,0);g.lineTo(-6,-5);g.moveTo(4.5,0);g.lineTo(6,-5);g.stroke();g.fillStyle='#ffd166';g.beginPath();g.arc(-4,1.2,1,0,7);g.arc(4,1.2,1,0,7);g.fill();g.fillStyle='#163d6b';g.fillRect(-3,4,6,3)}
if(K=='rock'){g.fillStyle='#f8f9fa';g.beginPath();g.moveTo(-3,-5.5);g.lineTo(0,4);g.lineTo(3,-5.5);g.fill();g.strokeStyle='#555';g.lineWidth=.9;g.beginPath();g.moveTo(-3,-5.5);g.lineTo(-1,6);g.moveTo(3,-5.5);g.lineTo(1,6);g.stroke();g.fillStyle='#ffd60a';g.font='bold 6px sans-serif';g.textAlign='center';g.fillText('★',-5,8);g.fillStyle='#adb5bd';for(const yy of[1,4,7]){g.beginPath();g.arc(5.5,yy,.6,0,7);g.fill()}}
if(K=='lunch'){g.fillStyle='#fff';g.strokeStyle=OL;g.lineWidth=.8;g.beginPath();g.moveTo(-6,-3);g.lineTo(6,-3);g.lineTo(7,11);g.lineTo(-7,11);g.closePath();g.fill();g.stroke();g.strokeStyle='#ccc';g.beginPath();g.rect(-3,4,6,4);g.stroke()}
if(K=='teach'){g.fillStyle='#e63946';g.beginPath();g.arc(-4,0,1.8,0,7);g.fill();g.fillStyle='#2d6a2f';g.fillRect(-4.3,-2.6,1,1)}
if(K=='gpa'){g.fillStyle='#3b2f2a';g.beginPath();g.moveTo(-2.5,-5);g.lineTo(0,3);g.lineTo(2.5,-5);g.fill();g.fillStyle='#d9c9a8';for(let b=-1;b<9;b+=3.5){g.beginPath();g.arc(0,b+1,.8,0,7);g.fill()}}
if(K!='coach'){g.fillStyle=pants;g.fillRect(-8.5,9,17,K=='mom'?0:2)}
// back arm
const sw=st.swing||0,lw=K=='mom'||K=='coach'?Math.sin(wk)*.3:0;
g.strokeStyle=OL;g.lineWidth=6.6;g.beginPath();g.moveTo(-7.5,-3);g.lineTo(-11,4+lw*6);g.lineTo(-10.5,10);g.stroke();
g.strokeStyle=ch.shirt;g.lineWidth=4;g.stroke();g.fillStyle=ch.skin;g.strokeStyle=OL;g.lineWidth=1;g.beginPath();g.arc(-10.5,11,2.5,0,7);g.fill();g.stroke();
// front arm (item arm)
const hx=13+sw*1,hy=-1-sw*12;g.strokeStyle=OL;g.lineWidth=6.6;g.beginPath();g.moveTo(7.5,-3);g.lineTo(11.5,2-sw*6);g.lineTo(hx,hy+3);g.stroke();
g.strokeStyle=ch.shirt;g.lineWidth=4;g.stroke();
g.save();g.translate(hx,hy+3);
